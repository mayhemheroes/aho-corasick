[package]
publish = false
name = "aho-corasick-fuzz"
version = "0.0.0"
authors = ["Automatically generated"]
edition = "2021"

# Prevent this from interfering with workspaces
[workspace]
members = ["."]

[dependencies]
aho-corasick = { path = ".." }
libfuzzer-sys = { version = "0.4", features = ["arbitrary-derive"] }

[[bin]]
name = "fuzz-find"
path = "fuzz-targets/fuzz_find.rs"
test = false
doc = false

[[bin]]
name = "find_one"
path = "fuzz-targets/find_one.rs"
test = false
doc = false

[[bin]]
name = "leftmost"
path = "fuzz-targets/leftmost.rs"
test = false
doc = false

[[bin]]
name = "replacing"
path = "fuzz-targets/replacing.rs"
test = false
doc = false

[[bin]]
name = "searching"
path = "fuzz-targets/searching.rs"
test = false
doc = false

[[bin]]
name = "searching_insensitive"
path = "fuzz-targets/searching_insensitive.rs"
test = false
doc = false

[package.metadata]
cargo-fuzz = true
